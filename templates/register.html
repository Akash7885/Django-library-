{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    
    <title>Register</title>
</head>

<body>

    <div class="container">
        <div>
            {% if messages %}
            {% for message in messages %}
                      <div class="alert alert-{{message.tags}} alert-dismissible fade show m-3" role="alert">
                       {{ message }}
                       <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                         <span aria-hidden="true">&times;</span>
                       </button>
                       </div>
             {% endfor %}
             {% endif %}
        </div>
        <div class="brand-logo" align="center">
            <!-- <img src="{% static 'img/library.png'%}" alt="logo" width="100" height="100"> -->
        </div>
        <div class="card card-container" style="margin-top: 20px;">
        
        <h2 class='login_title text-center' >Register Student</h2>
        <hr>
            <form class="form-signin" method="post"  enctype="multipart/form-data" action="{% url 'register' %}"> 
                {% csrf_token %}
                <p class="input_title">Profile Pic</p>
                <input id="pic" type="file" class="form-control login_box" name="pic" required="true">
                
                <p class="input_title"> Full Name</p>
                <input type="text" id="inputPassword" name="first_name" class="login_box" placeholder="Enter Full Name" required autofocus>
                
                <p class="input_title">Username</p>
                <input type="text" id="inputPassword" name="username" class="login_box" placeholder="Enter Username" required autofocus>
                
                <p class="input_title">Email</p>
                <input type="text" id="inputEmail" name="email" class="login_box" placeholder="Enter Email" required autofocus>
               
                <p class="input_title">Password</p>
                <input type="password" id="inputPassword" name="password" class="login_box" placeholder="Enter Password" required>
                
                <button class="btn btn-lg btn-primary" type="submit">Register</button>
            </form><!-- /form -->

            <div class="text-center">
                Already have an account? <a href="{% url 'Login'%}" class="text-primary">Login</a>
              </div>

            <div class="text-center home">
                <a href="/"><i class="bi bi-house"></i>Home</a>
            </div>

        </div><!-- /card-container -->
        
    </div><!-- /container -->

    <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
</body>

</html>
